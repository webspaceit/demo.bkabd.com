; BKABD Exam System — PHP-FPM pool (4C / 8GB VPS)
; Install: /etc/php/8.2/fpm/pool.d/oop-exam.conf
;
; Capacity math (8GB box):
;   OS + nginx + misc ......... ~1.0 GB
;   MySQL (buffer pool) ...... ~2.5 GB
;   PHP-FPM .................  ~4.0 GB  -> 50 workers x ~35-45 MB RSS = ~2 GB peak, leaves headroom
; 50 workers x 4 cores is the sweet spot for this app: queries are sub-ms,
; most requests are cheap. Tune max_children up only if queuing shows up.

[oop-exam]
user  = www-data
group = www-data
listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20

; Recycle workers so a long-running result-day process never leaks memory:
pm.max_requests = 1000

; Cap per-request time (generate PDF/xlsx can be slow; result search is fast)
request_terminate_timeout = 60
request_slowlog_timeout = 5
slowlog = /var/log/php-fpm-oop-exam.slow.log

; Result day: keep the session file lock held as little as possible.
; The app already does Session::close() BEFORE the heavy queries on
; /result/search, so FPM-side defaults are fine here.
php_admin_value[error_log] = /var/log/php-fpm-oop-exam.error.log
php_admin_flag[log_errors] = on

; php.ini overrides scoped to this pool (see deploy/php/opcache-php.ini for OPcache)
php_value[realpath_cache_size] = 4096k
php_value[realpath_cache_ttl] = 600
php_value[upload_max_filesize] = 25M
php_value[post_max_size] = 30M
php_value[max_execution_time] = 60
php_value[memory_limit] = 512M