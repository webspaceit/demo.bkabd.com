; BKABD Exam System — PHP production settings (append to /etc/php/8.2/fpm/php.ini
; or drop into /etc/php/8.2/fpm/conf.d/99-oop-exam.ini)
;
; The app ships dompdf + phpspreadsheet in vendor/ (~3,000+ files), so the
; OPcache file/t memory defaults are too small — bump them.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 1
; 60s revalidate: code changes get picked up within a minute WITHOUT
; restarting php-fpm (handy during rollout). Once result day is frozen you can
; flip both below to squeeze out the stat() calls entirely:
opcache.revalidate_freq = 60
opcache.enable_file_override = 1
opcache.fast_shutdown = 1

; ---- general ----
realpath_cache_size = 4096k
realpath_cache_ttl = 600
expose_php = Off

; ---- sessions (default file handler is fine at this scale; the app closes the
; session before heavy work on /result/search). Directory must be writable by
; the FPM user:  chown www-data:www-data /var/lib/php/sessions
session.gc_maxlifetime = 7200
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; ---- errors (matches bootstrap/app.php: APP_DEBUG=false -> no display) ----
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED