# BKABD Exam System — nginx server block (4C / 8GB VPS)
# Install: /etc/nginx/sites-available/oop-exam
#          ln -s /etc/nginx/sites-available/oop-exam /etc/nginx/sites-enabled/
# Replace server_name with your domain or VPS IP.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;            # <-- your domain / IP

    root /var/www/oop-exam/public;      # ONLY public/ is web-accessible (no vhost refactor needed)
    index index.php;

    client_max_body_size 25m;           # student photo uploads

    # ---- logs ----
    access_log /var/log/nginx/oop-exam.access.log;
    error_log  /var/log/nginx/oop-exam.error.log;

    # ---- static assets: served directly by nginx, never touch PHP ----
    location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|pdf|xlsx)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---- user uploads: images only — hard-deny anything script-shaped ----
    # (CWE-434: without this, a .php planted in /uploads would hit the
    #  location ~ \.php$ below and execute under php-fpm.)
    location ~* ^/(uploads|images)/.*\.(?i:php|phtml|php[0-9]|phps|phar|pht|cgi|pl|py|sh|asp|aspx|jsp|jspx|jar|exe)$ {
        return 403;
    }

    # ---- PHP application (front controller) ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # matches the FPM pool socket
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ---- never serve anything else hidden above public/ (.env, composer.json, app/, storage/) ----
    # (they live outside the root, so this is belt-and-braces for dotfiles INSIDE public/)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ---- gzip (HTML/JSON are the bulk of result-day traffic) ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ---- security headers (also mirrored by public/.htaccess for Apache) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}

# HTTPS: after DNS points here, run:  certbot --nginx -d example.com
# and the block above gets port-443 + redirect handled automatically.